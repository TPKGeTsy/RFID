; PlatformIO project for the LilyGo TTGO T-Display (ESP32 + 1.14" ST7789 IPS, 135x240)
; https://github.com/Xinyuan-LilyGO/TTGO-T-Display

[env:ttgo-t-display]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; BLE HID keyboard (to a PC) + TFT_eSPI + ArduinoJson no longer fit in the
; default 1.3MB app partition; this board has 4MB of flash and no OTA
; update path, so give the app the rest of it.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
    https://github.com/T-vK/ESP32-BLE-Keyboard.git

build_flags =
    ; --- TFT_eSPI pin/driver setup for the TTGO T-Display, done via build
    ; flags so nothing in the library's User_Setup.h needs editing ---
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D CGRAM_OFFSET=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
